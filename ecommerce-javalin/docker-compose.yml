version: '3.8'

services:

  # ── API GATEWAY ────────────────────────────────────────────────────────────
  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ORDER_SERVICE_URL=http://order-service:8002
      - STOCK_SERVICE_URL=http://stock-service:8003
      - PAYMENT_SERVICE_URL=http://payment-service:8004
      - DELIVERY_SERVICE_URL=http://delivery-service:8005
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8006
    depends_on:
      - auth-service
      - order-service
      - stock-service
      - payment-service
      - delivery-service
      - recommendation-service
    networks:
      - ecommerce-net

  # ── AUTH SERVICE ───────────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8001:8001"
    volumes:
      - ./data/auth:/app/data
    networks:
      - ecommerce-net

  # ── ORDER SERVICE ──────────────────────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8002:8002"
    volumes:
      - ./data/order:/app/data
    networks:
      - ecommerce-net

  # ── STOCK SERVICE ──────────────────────────────────────────────────────────
  stock-service:
    build: ./stock-service
    container_name: stock-service
    ports:
      - "8003:8003"
    volumes:
      - ./data/stock:/app/data
    networks:
      - ecommerce-net

  # ── PAYMENT SERVICE (Java Spring Boot) ────────────────────────────────────
  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8004:8004"
    volumes:
      - ./data/payment:/app/data
    networks:
      - ecommerce-net

  # ── DELIVERY SERVICE ───────────────────────────────────────────────────────
  delivery-service:
    build: ./delivery-service
    container_name: delivery-service
    ports:
      - "8005:8005"
    volumes:
      - ./data/delivery:/app/data
    networks:
      - ecommerce-net

  # ── RECOMMENDATION SERVICE ─────────────────────────────────────────────────
  recommendation-service:
    build: ./recommendation-service
    container_name: recommendation-service
    ports:
      - "8006:8006"
    volumes:
      - ./data/recommendation:/app/data
    networks:
      - ecommerce-net

  # ── FRONTEND (Streamlit) ───────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  auth-data:
  order-data:
  stock-data:
  payment-data:
  delivery-data:
  recommendation-data:
